name: Validate plugin index

on:
  push:
    branches: [main]
    paths:
      - index.json
      - schema/**
      - scripts/**
      - .github/workflows/**
  pull_request:
    paths:
      - index.json
      - schema/**
      - scripts/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: validate-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet jsonschema==4.23.0
      - name: Validate index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_index.py
      - name: Audit plugin packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_plugin.py

  merge:
    # 校验与审计都通过后自动合并 PR：商店内容因此只需通过检查即可上架。
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Squash merge approved plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --squash --delete-branch --repo "${{ github.repository }}"
