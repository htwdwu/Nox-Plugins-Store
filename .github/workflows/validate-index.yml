name: Validate plugin index

on:
  push:
    branches: [main]
    paths:
      - index.json
      - schema/**
      - scripts/**
      - .github/workflows/**
  pull_request:
    paths:
      - index.json
      - schema/**
      - scripts/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet jsonschema==4.23.0
      - name: Validate index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_index.py
