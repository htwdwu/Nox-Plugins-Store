name: Ingest plugin inbox

on:
  schedule:
    # 每 15 分钟扫一次暂存区；GitHub 的高频 cron 会有排队延迟，够用。
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-inbox
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet jsonschema==4.23.0
      - name: Ingest inbox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 暂存区是另一个账号的仓库，GITHUB_TOKEN 只能读；清理已上架的源包
          # 需要这条对暂存区有 push 权限的个人 PAT。没配就只跳过清理。
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
          INBOX_REPO: yyds0399/Muse-Plugins-Inbox
          INDEX_REPO: ${{ github.repository }}
        run: python scripts/ingest_inbox.py
      - name: Validate index after ingest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ingest 刚提交的包与索引在 raw/CDN 上还没刷新，立刻校验会误报；重试三次。
        run: |
          for i in 1 2 3; do
            if python scripts/validate_index.py; then exit 0; fi
            echo "validate failed (attempt $i), retry in 60s"
            sleep 60
          done
          exit 1
